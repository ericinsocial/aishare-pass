name: Deploy AISHARE to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the deck be re-published without a code change (e.g. after a
  # Pages settings change) straight from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A talk is only ever given from one build. Never cancel a deploy that is
# already publishing; just queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # vite.config.ts keeps base: './', so every emitted URL is relative and
      # the same dist/ serves correctly from the /aishare/ project sub-path.
      # Routing is hash-based, so no rewrite rules are required.
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
