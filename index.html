<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages replaces every hashed asset on each deploy but serves
      // index.html with a ~10 minute cache, so a browser still holding the
      // previous index.html can ask for a bundle that no longer exists.
      // Nothing mounts and the deck is a black screen, mid-talk.
      //
      // Key the retry on the symptom that actually matters — #root still empty
      // once loading has settled — not on stray resource errors. An error
      // listener also fires for things the deck can live without (a favicon, an
      // extension-injected tag), and navigating away on those aborts a page
      // that was loading perfectly well.
      ;(function () {
        function stillBlank() {
          var root = document.getElementById('root')
          if (!root) return false
          return root.childElementCount === 0 || !!document.getElementById('boot-fallback')
        }
        window.addEventListener('load', function () {
          // load waits for the module script, so React has had its chance by
          // now; the extra pause is only slack for a slow machine.
          setTimeout(function () {
            // Retry once only: ?v= already present means the fresh copy failed
            // too, and a reload loop would be worse than a blank slide.
            if (!stillBlank() || /[?&]v=/.test(location.search)) return
            location.replace(location.pathname + '?v=' + Date.now() + location.hash)
          }, 3000)
        })
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%93%3C/text%3E%3C/svg%3E"
    />
    <title>AISHARE</title>
  </head>
  <body>
    <!--
      React clears #root on mount, so this notice is only ever seen when the
      bundle did not run. A black screen tells the presenter nothing; this tells
      them the page arrived and the script did not, which is the one distinction
      worth having on stage.
    -->
    <div id="root">
      <div
        id="boot-fallback"
        style="
          font: 15px/1.7 system-ui, -apple-system, 'Noto Sans TC', sans-serif;
          color: #f4f1ea;
          background: #0a0a0c;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          text-align: center;
          padding: 2rem;
        "
      >
        <div style="font-size: 1.25rem; font-weight: 700">簡報載入中…</div>
        <div style="opacity: 0.62; max-width: 34rem">
          如果這段文字停在這裡沒有消失，表示頁面有下載到、但 JavaScript 沒有執行。
          請按 <strong>Ctrl / Cmd + Shift + R</strong> 強制重整；若仍然一樣，
          請打開瀏覽器主控台（F12 → Console）看錯誤訊息。
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
